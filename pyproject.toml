[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "tophost-dns-mcp"
version = "0.1.0"
description = "MCP server for the unofficial Tophost DNS API"
readme = "README.md"
authors = [
    { name = "Daniel Vedovato" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["tophost", "dns", "mcp", "model-context-protocol"]
dependencies = [
    "mcp>=2,<3",
    "httpx>=0.28,<1",
    "pydantic>=2,<3",
]

[project.urls]
Homepage = "https://github.com/DanielVd/tophost-dns-mcp"
Repository = "https://github.com/DanielVd/tophost-dns-mcp"
Issues = "https://github.com/DanielVd/tophost-dns-mcp/issues"
"Tophost DNS API" = "https://github.com/DanielVd/tophost-dns-api"

[project.scripts]
tophost-dns-mcp = "tophost_dns_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
